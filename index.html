<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BilalAI 1.0 - Flash</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --accent-color: #00bfff;
      --accent-glow: rgba(0, 191, 255, 0.4);
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --user-msg: #1e293b;
      --ai-msg: #111827;
      --system-msg: rgba(0, 191, 255, 0.1);
      --border-color: #2a364f;
      --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    [data-theme="light"] {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --user-msg: #e2e8f0;
      --ai-msg: #ffffff;
      --system-msg: #e0f2fe;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* HEADER */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { font-size: 1.2rem; font-weight: 700; }

    .flash-badge {
      background: linear-gradient(135deg, #00bfff, #005f9e);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: 0 0 10px var(--accent-glow);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 5px var(--accent-glow); }
      50% { box-shadow: 0 0 15px var(--accent-color); }
      100% { box-shadow: 0 0 5px var(--accent-glow); }
    }

    .header-controls { display: flex; gap: 10px; align-items: center; }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .btn-icon:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    /* CHAT AREA */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 80%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; }
    .message.ai { align-self: flex-start; }
    .message.system { align-self: center; max-width: 90%; }

    .bubble {
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
      border: 1px solid var(--border-color);
    }

    .user .bubble { background-color: var(--user-msg); border-bottom-right-radius: 2px; }
    .ai .bubble { background-color: var(--ai-msg); border-bottom-left-radius: 2px; }
    .system .bubble {
      background-color: var(--system-msg);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      text-align: center;
      font-weight: 500;
    }

    .thinking-box {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 12px;
      border-left: 3px solid var(--accent-color);
      border-radius: 4px;
      margin-bottom: 8px;
      font-style: italic;
    }

    .feedback-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-feedback {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-feedback:hover { color: var(--accent-color); }

    pre {
      background: #050811;
      color: #00ffcc;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: monospace;
      margin: 8px 0;
      border: 1px solid var(--border-color);
    }

    /* INPUT AREA */
    .input-container {
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    textarea {
      flex: 1;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      resize: none;
      height: 48px;
      font-family: inherit;
      outline: none;
    }

    textarea:focus { border-color: var(--accent-color); }

    .model-select {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--accent-color);
      padding: 0 12px;
      height: 48px;
      border-radius: 8px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .btn-send {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 0 20px;
      height: 48px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-send:hover { background: #33ccff; }

    /* ADMIN PANEL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.active { display: flex; }

    .admin-panel {
      background: var(--card-bg);
      border: 1px solid var(--accent-color);
      width: 90%;
      max-width: 650px;
      max-height: 85vh;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .admin-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .metric-card {
      background: var(--bg-color);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .metric-card span { display: block; font-size: 0.75rem; color: var(--text-muted); }
    .metric-card strong { font-size: 1.2rem; color: var(--accent-color); }

    .admin-controls { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-danger { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    .btn-secondary { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }

    .system-input-group { display: flex; gap: 8px; }
    .system-input-group input {
      flex: 1; background: var(--bg-color); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 8px; border-radius: 6px; outline: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>BilalAI</h1>
      <span class="flash-badge" id="currentModelBadge">1.0 - FLASH</span>
    </div>
    <div class="header-controls">
      <button class="btn-icon" id="themeToggleBtn">🌙 / ☀️</button>
      <button class="btn-icon" id="openAdminBtn">🔐 Kurucu</button>
    </div>
  </header>

  <div class="chat-container" id="chatContainer"></div>

  <div class="input-container">
    <textarea id="userInput" placeholder="Mesajınızı yazın... (Enter ile gönder)"></textarea>
    
    <!-- Model Seçenekleri Kutusu -->
    <select class="model-select" id="modelSelect">
      <option value="BilalAI 1.0 - Flash">Flash 1.0</option>
      <option value="BilalAI 1.0 - Pro">Pro 1.0 (Planlanan)</option>
    </select>

    <button class="btn-send" id="sendBtn">Gönder</button>
  </div>

  <!-- ADMIN PANEL MODAL -->
  <div class="modal-overlay" id="adminModal">
    <div class="admin-panel">
      <div class="admin-header">
        <h3>🔐 Kurucu Yönetim Paneli</h3>
        <button class="btn-icon" id="closeAdminBtn">✕</button>
      </div>
      
      <div class="admin-body" id="adminLogin">
        <p>Kurucu Parolası:</p>
        <input type="password" id="founderPassword" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: white;">
        <button class="btn-secondary" id="loginBtn">Giriş</button>
      </div>

      <div class="admin-body" id="adminDashboard" style="display: none;">
        <div class="metrics-grid">
          <div class="metric-card">
            <span>Performans Puanı</span>
            <strong id="perfScore">85 / 100</strong>
          </div>
          <div class="metric-card">
            <span>Öğrenilen Hatalar</span>
            <strong id="errorCount">0</strong>
          </div>
          <div class="metric-card">
            <span>Pratik Edilen Beceriler</span>
            <strong id="skillCount">0</strong>
          </div>
        </div>

        <div>
          <h4 style="margin-bottom: 8px; color: var(--accent-color);">Sistem Mesajı Gönder</h4>
          <div class="system-input-group">
            <input type="text" id="systemMsgInput" placeholder="Sistem talimatı...">
            <button class="btn-secondary" id="sendSystemMsgBtn">Gönder</button>
          </div>
        </div>

        <div>
          <h4 style="margin-bottom: 4px; color: var(--accent-color);">Hata Günlüğü</h4>
          <div id="errorLogDisplay" style="font-size: 0.8rem; color: var(--text-muted); max-height: 80px; overflow-y: auto;">Kayıt yok.</div>
        </div>

        <div class="admin-controls">
          <button class="btn-secondary" id="exportLogsBtn">Günlükleri İndir (.json)</button>
          <button class="btn-danger" id="clearMemoryBtn">Hafızayı Sıfırla</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const FOUNDER_PASS = "BilalAI_founder_2024";

    let state = {
      theme: 'dark',
      history: [],
      errorLog: [],
      skills: {},
      performanceScore: 85,
      activeModel: 'BilalAI 1.0 - Flash'
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderChat();
      setupEvents();
      if (state.history.length === 0) {
        addAiMessage("Merhaba! Ben **BilalAI 1.0 - Flash**. Kod yazma, uygulama geliştirme ve insan talimatlarını anlama konusunda uzmanım. Bugün ne inşa ediyoruz?");
      }
    });

    function loadState() {
      const saved = localStorage.getItem('bilalAI_data');
      if (saved) {
        try { state = { ...state, ...JSON.parse(saved) }; } catch (e) {}
      }
      document.documentElement.setAttribute('data-theme', state.theme);
      document.getElementById('modelSelect').value = state.activeModel;
    }

    function saveState() {
      localStorage.setItem('bilalAI_data', JSON.stringify({
        theme: state.theme,
        history: state.history,
        errorLog: state.errorLog,
        skills: state.skills,
        performanceScore: state.performanceScore,
        activeModel: state.activeModel
      }));
    }

    function setupEvents() {
      document.getElementById('sendBtn').addEventListener('click', handleSend);
      document.getElementById('userInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
      });

      document.getElementById('themeToggleBtn').addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', state.theme);
        saveState();
      });

      document.getElementById('modelSelect').addEventListener('change', (e) => {
        state.activeModel = e.target.value;
        document.getElementById('currentModelBadge').innerText = state.activeModel.replace('BilalAI ', '');
        saveState();
      });

      const openAdmin = () => document.getElementById('adminModal').classList.add('active');
      const closeAdmin = () => document.getElementById('adminModal').classList.remove('active');

      document.getElementById('openAdminBtn').addEventListener('click', openAdmin);
      document.getElementById('closeAdminBtn').addEventListener('click', closeAdmin);

      window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
          e.preventDefault(); openAdmin();
        }
      });

      document.getElementById('loginBtn').addEventListener('click', () => {
        if (document.getElementById('founderPassword').value === FOUNDER_PASS) {
          document.getElementById('adminLogin').style.display = 'none';
          document.getElementById('adminDashboard').style.display = 'flex';
          updateDashboard();
        } else { alert('Hatalı Şifre!'); }
      });

      document.getElementById('sendSystemMsgBtn').addEventListener('click', () => {
        const input = document.getElementById('systemMsgInput');
        if (input.value.trim()) {
          addSystemMessage(input.value.trim());
          processResponse(input.value.trim(), true);
          input.value = '';
          closeAdmin();
        }
      });

      document.getElementById('clearMemoryBtn').addEventListener('click', () => {
        if (confirm("Tüm hafıza temizlensin mi?")) {
          localStorage.removeItem('bilalAI_data');
          location.reload();
        }
      });

      document.getElementById('exportLogsBtn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `BilalAI_Logs.json`;
        a.click();
      });
    }

    function handleSend() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      addUserMessage(text);
      input.value = '';
      processResponse(text, false);
    }

    function addUserMessage(text) {
      const msg = { sender: 'user', text, time: new Date().toISOString() };
      state.history.push(msg);
      saveState();
      renderSingleMsg(msg);
    }

    function addSystemMessage(text) {
      const msg = { sender: 'system', text, time: new Date().toISOString() };
      state.history.push(msg);
      saveState();
      renderSingleMsg(msg);
    }

    function addAiMessage(text) {
      const msg = { sender: 'ai', text, time: new Date().toISOString(), id: Date.now() };
      state.history.push(msg);
      saveState();
      renderSingleMsg(msg);
    }

    function renderChat() {
      const container = document.getElementById('chatContainer');
      container.innerHTML = '';
      state.history.forEach(renderSingleMsg);
    }

    function renderSingleMsg(msg) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.classList.add('message', msg.sender);

      if (msg.sender === 'system') {
        div.innerHTML = `<div class="bubble">🔐 [Sistem / Kurucu]: ${escapeHTML(msg.text)}</div>`;
      } else if (msg.sender === 'user') {
        div.innerHTML = `<div class="bubble">${escapeHTML(msg.text)}</div>`;
      } else {
        div.innerHTML = `
          <div class="bubble">
            ${msg.thinking ? `<div class="thinking-box">💭 <strong>Akıl Yürütme:</strong> ${escapeHTML(msg.thinking)}</div>` : ''}
            <div>${parseMarkdown(msg.text)}</div>
          </div>
          <div class="feedback-actions">
            <button class="btn-feedback" onclick="feedback(${msg.id}, 'up')">👍</button>
            <button class="btn-feedback" onclick="feedback(${msg.id}, 'down')">👎 Düzelt</button>
          </div>
        `;
      }
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function processResponse(text, isSystem) {
      const container = document.getElementById('chatContainer');
      const thinkingDiv = document.createElement('div');
      thinkingDiv.classList.add('message', 'ai');
      thinkingDiv.innerHTML = `<div class="bubble" style="opacity: 0.7;">⚡ <i>${state.activeModel} analiz ediyor...</i></div>`;
      container.appendChild(thinkingDiv);
      container.scrollTop = container.scrollHeight;

      setTimeout(() => {
        thinkingDiv.remove();
        let thinking = "";
        let response = "";

        if (isSystem) {
          thinking = "Sistem komutu doğrulandı. Kurucu kimliği tespit edildi.";
          response = "Merhaba Kurucum, Bilal. Sistem mesajınızı aldım ve talimatlarınızı güncelledim.";
        } else {
          thinking = "Kullanıcı talebi analiz ediliyor. Kod yapısı ve gereksinimler taranıyor.";
          response = `**${state.activeModel}** ile yanıtım:\n\nİstediğiniz projenin mimarisini oluşturuyorum. İşte örnek yapı:\n\n\`\`\`javascript\nconsole.log("${text} projesi başlatıldı.");\n\`\`\``;
        }

        state.performanceScore = Math.min(100, state.performanceScore + 1);
        const aiMsg = { sender: 'ai', text: response, thinking, time: new Date().toISOString(), id: Date.now() };
        state.history.push(aiMsg);
        saveState();
        renderSingleMsg(aiMsg);
      }, 1000);
    }

    window.feedback = function(id, type) {
      if (type === 'down') {
        const note = prompt("Modelin düzeltmesi gereken hatayı yazın:");
        if (note) {
          state.errorLog.push({ time: new Date().toLocaleString(), note });
          state.performanceScore = Math.max(40, state.performanceScore - 5);
          saveState();
          alert("Hata kaydedildi.");
        }
      } else {
        state.performanceScore = Math.min(100, state.performanceScore + 2);
        saveState();
      }
    };

    function updateDashboard() {
      document.getElementById('perfScore').innerText = `${state.performanceScore} / 100`;
      document.getElementById('errorCount').innerText = state.errorLog.length;
      document.getElementById('skillCount').innerText = Object.keys(state.skills).length;
      if (state.errorLog.length > 0) {
        document.getElementById('errorLogDisplay').innerHTML = state.errorLog.map(e => `<div>• ${escapeHTML(e.note)}</div>`).join('');
      }
    }

    function escapeHTML(s) { return s.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c])); }
    function parseMarkdown(s) {
      let h = escapeHTML(s);
      h = h.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      return h.replace(/\n/g, '<br>');
    }
  </script>
</body>
</html>
